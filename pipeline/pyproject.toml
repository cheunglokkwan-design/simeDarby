[project]
name = "solar-mapper"
version = "0.1.0"
description = "Offline data pipeline for the Solar Opportunity Mapper (Sime Darby Property University Hackathon 2026)"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Car-park detection from imagery (solar-mapper detect-carparks). For a CPU-only PyTorch:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
detect = ["ultralytics>=8.3", "pillow>=10"]

[project.scripts]
solar-mapper = "solar_mapper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solar_mapper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
