<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micro-Verification Viewer</title>
    <style>
      :root { font-family: Inter, system-ui, 'Segoe UI', sans-serif; color: #e8ebf1; }
      html, body { margin: 0; height: 100%; background: #0f1218; overflow: hidden; }
      #viewer { position: absolute; inset: 0; }
      .card {
        position: absolute; top: 12px; left: 12px; max-width: 380px; z-index: 2;
        background: rgba(20, 24, 32, 0.92); border: 1px solid #2a3140; border-radius: 12px; padding: 12px 14px; font-size: 13px;
      }
      .card h1 { margin: 0 0 4px; font-size: 16px; color: #ffc94a; }
      .card p { margin: 4px 0; color: #9aa3b5; }
      .card input { width: 100%; background: #1a1f2a; color: #e8ebf1; border: 1px solid #2a3140; border-radius: 6px; padding: 5px; margin-top: 6px; }
      #progress { color: #55d68a; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>3D Micro-Verification</h1>
      <p id="site"></p>
      <p>Gaussian splat of an open-source sample scene. In production this would be a splat built from drone footage of the selected rooftop (Pathway A: Luma/Polycam API, Pathway B: rented GPU running gsplat).</p>
      <p>Drag to orbit · right-drag to pan · scroll to zoom</p>
      <p id="progress">Loading splat…</p>
      <form id="form"><input id="url" placeholder="Paste a .splat / .ply / .ksplat URL and press Enter" /></form>
    </div>
    <div id="viewer"></div>
    <script type="module" src="/src/splat.js"></script>
  </body>
</html>
